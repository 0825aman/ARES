services:
  # ==============================================================================
  # 1. ARES Backend Web Service (FastAPI)
  # ==============================================================================
  - type: web
    name: ares-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    disk:
      name: ares-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ares-postgres
          property: connectionString
      - key: CHECKPOINT_DB_URL
        value: /var/data/ares_checkpoints.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: EXPORT_DIR
        value: /var/data/exports
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: ares-frontend
          property: host
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: AUTO_LOGIN_DEV
        value: "false"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_API_KEY
        sync: false
      - key: FALLBACK_LLM_PROVIDERS
        value: groq,openrouter
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ==============================================================================
  # 2. ARES Frontend Web Service (Next.js)
  # ==============================================================================
  - type: web
    name: ares-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: web
          name: ares-backend
          property: host
      - key: NEXT_PUBLIC_AUTO_LOGIN_DEV
        value: "false"
      - key: AUTO_LOGIN_DEV
        value: "false"

# ==============================================================================
# 3. PostgreSQL Database
# ==============================================================================
databases:
  - name: ares-postgres
    databaseName: ares
    user: ares_user
    plan: free
